<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar su registro</title>
</head>
<body>
    <main>
        <h1>INSCRIPCIONES Y FONDOS</h1>
        <p>Complete el siguiente formulario para inscribirse en nuestro evento y solicitar fondos.</p>
        <form action="agradecimiento.html" method="POST">
            <label for="name">Nombre:</label>
            <input type="text" id="name" name="name" required 
            placeholder="Ingrese su nombre"/><br><br>

            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required
            placeholder="Ejemplo@dominio.com"/><br><br>

            <label for="checkin">Fecha de llegada:</label>
            <input type="date" id="checkin" name="checkin" required><br><br>

            <label for="checkout">Fecha de salida:</label>
            <input type="date" id="checkout" name="checkout" required><br><br>

            <label for="guests">Número de solicitantes:</label>
            <input type="number" id="guests" name="guests" min="1" max="20" required><br><br>

            <textarea name="comments" id="comments" rows="4" cols="50" placeholder="Comentarios adicionales..."></textarea><br><br>
            <input type="submit" value="Reservar">
        <button type="reset">Restablecer</button>
        <button onclick="window.location.href='index.html'">Volver a la página de inicio</button>
        </form>
    </main>
    
</body>
</html>
